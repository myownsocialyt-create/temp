name: Android Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (typecheck, engine tests, backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
            tools/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Install tooling dependencies
        working-directory: tools
        run: npm ci

      - name: Puzzle engine tests (15 categories x 120 runs)
        working-directory: tools
        run: npm run test:engine

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Smoke-test backend health endpoint
        working-directory: backend
        run: |
          node dist/main.js &
          sleep 3
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
          echo "GET /health -> ok"

  android:
    name: Android APK + AAB (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build release APK and AAB
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/WordSearchKing-v1.0.0.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab artifacts/WordSearchKing-v1.0.0.aab
          ls -la artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-search-king-apk
          path: artifacts/WordSearchKing-v1.0.0.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-search-king-aab
          path: artifacts/WordSearchKing-v1.0.0.aab
          if-no-files-found: error
          compression-level: 0
