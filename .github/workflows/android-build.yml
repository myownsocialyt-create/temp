name: Android Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the failure-diagnostics step to post a commit comment with the gradle
# error excerpt.
permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (typecheck, engine tests, backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
            tools/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Install tooling dependencies
        working-directory: tools
        run: npm ci

      - name: Puzzle engine tests (15 categories x 120 runs)
        working-directory: tools
        run: npm run test:engine

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Smoke-test backend health endpoint
        working-directory: backend
        run: |
          node dist/main.js &
          sleep 3
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
          echo "GET /health -> ok"

  android:
    name: Android APK + AAB (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build release APK and AAB
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: Report failure (annotations + commit comment)
        if: failure()
        run: |
          # 1) Emit the key error lines as step annotations (readable via the API
          #    without any extra permissions). Most valuable lines FIRST because
          #    GitHub caps annotations at 10 per step.
          {
            grep -A 8 "Using the following versions" /tmp/gradle-build.log
            grep -E "^e: |incompatible version of Kotlin" /tmp/gradle-build.log | head -6
            grep -B 2 -A 12 "What went wrong" /tmp/gradle-build.log | head -30
            grep -m 3 -A 10 -E "^Caused by|Execution failed" /tmp/gradle-build.log | head -30
            tail -n 15 /tmp/gradle-build.log
          } | sed 's/%/%25/g; s/\r$//' | grep -v '^--$' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}" || true
          done

          # 2) Post a fuller excerpt as a commit comment.
          {
            echo "### Android build failed — gradle error excerpt"
            echo '```'
            grep -A 8 "Using the following versions" /tmp/gradle-build.log || true
            grep -E "^e: |incompatible version of Kotlin" /tmp/gradle-build.log | head -10 || true
            grep -B 20 -A 80 "What went wrong" /tmp/gradle-build.log | head -140 || tail -n 100 /tmp/gradle-build.log
            echo '```'
            echo "_(automated diagnostics from run ${{ github.run_id }})_"
          } > /tmp/comment.md
          PAYLOAD=$(jq -n --rawfile b /tmp/comment.md '{body: $b}')
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$PAYLOAD" > /dev/null || echo "(could not post commit comment)"

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/WordSearchKing-v1.0.0.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab artifacts/WordSearchKing-v1.0.0.aab
          ls -la artifacts

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word-search-king-apk
          path: artifacts/WordSearchKing-v1.0.0.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word-search-king-aab
          path: artifacts/WordSearchKing-v1.0.0.aab
          if-no-files-found: error
          compression-level: 0

  # Smoke test: launch the freshly built APK on an Android emulator and
  # verify the app actually opens without crashing. The full logcat is
  # captured as an artifact, and any FATAL EXCEPTION stack trace is posted
  # as annotations + a commit comment.
  smoke:
    name: Smoke test APK (emulator)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Re-roll the runner if the first attempt hits an emulator/KVM-less host.
      # A real app crash fails every attempt, so the signal stays honest.
      fail-fast: false
      max-parallel: 1
      matrix:
        attempt: [1, 2]
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: word-search-king-apk

      - name: Check KVM availability (fail fast on KVM-less hosts)
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available on this runner - hardware emulation impossible. Failing fast; the next matrix attempt re-rolls the runner."
            exit 1
          fi
          echo "/dev/kvm present"

      - name: Boot emulator and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none -no-metrics
          emulator-boot-timeout: 900
          script: |
            set +e
            echo "=== Installing APK ==="
            adb install -r WordSearchKing-v1.0.0.apk
            adb logcat -c
            echo "=== Launching com.wordsearchking.game/.MainActivity ==="
            adb shell am start -W -n com.wordsearchking.game/.MainActivity
            sleep 40
            adb logcat -d > /tmp/logcat.txt

            echo "=== Resumed activity ==="
            adb shell "dumpsys activity activities | grep -E 'ResumedActivity' | head -3"

            PID=$(adb shell pidof com.wordsearchking.game | tr -d '\r\n ')
            FATALS=$(grep -c "FATAL EXCEPTION" /tmp/logcat.txt)

            echo "=== pidof: '$PID' | fatal exceptions: $FATALS ==="
            echo "=== ReactNativeJS lines ==="
            grep "ReactNativeJS" /tmp/logcat.txt | head -40

            CRASH=0
            if [ -z "$PID" ]; then
              CRASH=1
              echo "::error::App process is NOT running 40s after launch - crashed on open"
            fi
            if [ "$FATALS" != "0" ]; then
              CRASH=1
              echo "::error::FATAL EXCEPTION detected in logcat"
            fi
            if [ "$CRASH" != "0" ]; then
              echo "=== FATAL EXCEPTION excerpt ==="
              grep -A 60 "FATAL EXCEPTION" /tmp/logcat.txt | head -90
              exit 1
            fi
            echo "App is alive and running (pid $PID) - smoke test PASSED"

      - name: Report crash details (annotations + commit comment)
        if: ${{ !cancelled() && !success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/logcat.txt ]; then
            echo "::error::No logcat captured - the emulator itself likely failed (check the job log above)"
            exit 0
          fi
          # Annotations: first lines of the crash stack (GitHub caps annotations at 10)
          grep -A 60 "FATAL EXCEPTION" /tmp/logcat.txt | head -60 | sed 's/%/%25/g; s/\r$//' | \
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:900}" || true
            done
          # Commit comment with the full picture
          {
            echo "### Emulator smoke test - app crashed on open"
            echo ""
            echo "#### FATAL EXCEPTION (logcat)"
            echo '```'
            grep -B 2 -A 80 "FATAL EXCEPTION" /tmp/logcat.txt | head -130
            echo '```'
            echo ""
            echo "#### ReactNativeJS log lines"
            echo '```'
            grep "ReactNativeJS" /tmp/logcat.txt | head -40 || echo "(none)"
            echo '```'
            echo ""
            echo "#### Last 40 logcat lines"
            echo '```'
            tail -n 40 /tmp/logcat.txt
            echo '```'
            echo "_(automated diagnostics from smoke test in run ${{ github.run_id }})_"
          } > /tmp/comment.md
          head -c 60000 /tmp/comment.md > /tmp/comment-trunc.md
          PAYLOAD=$(jq -n --rawfile b /tmp/comment-trunc.md '{body: $b}')
          SHA=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq '.sha')
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/comments" \
            -d "$PAYLOAD" > /dev/null || echo "(could not post commit comment)"

      - name: Upload logcat artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat-attempt-${{ matrix.attempt }}
          path: /tmp/logcat.txt
          if-no-files-found: ignore
