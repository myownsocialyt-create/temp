name: Android Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the failure-diagnostics step to post a commit comment with the gradle
# error excerpt.
permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (typecheck, engine tests, backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            backend/package-lock.json
            tools/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile app
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Install tooling dependencies
        working-directory: tools
        run: npm ci

      - name: Puzzle engine tests (15 categories x 120 runs)
        working-directory: tools
        run: npm run test:engine

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Smoke-test backend health endpoint
        working-directory: backend
        run: |
          node dist/main.js &
          sleep 3
          curl -sf http://localhost:3000/health | grep -q '"status":"ok"'
          echo "GET /health -> ok"

  android:
    name: Android APK + AAB (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build release APK and AAB
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-build.log

      - name: Report failure (annotations + commit comment)
        if: failure()
        run: |
          # 1) Emit the key error lines as step annotations (readable via the API
          #    without any extra permissions). Most valuable lines FIRST because
          #    GitHub caps annotations at 10 per step.
          {
            grep -A 8 "Using the following versions" /tmp/gradle-build.log
            grep -E "^e: |incompatible version of Kotlin" /tmp/gradle-build.log | head -6
            grep -B 2 -A 12 "What went wrong" /tmp/gradle-build.log | head -30
            grep -m 3 -A 10 -E "^Caused by|Execution failed" /tmp/gradle-build.log | head -30
            tail -n 15 /tmp/gradle-build.log
          } | sed 's/%/%25/g; s/\r$//' | grep -v '^--$' | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}" || true
          done

          # 2) Post a fuller excerpt as a commit comment.
          {
            echo "### Android build failed — gradle error excerpt"
            echo '```'
            grep -A 8 "Using the following versions" /tmp/gradle-build.log || true
            grep -E "^e: |incompatible version of Kotlin" /tmp/gradle-build.log | head -10 || true
            grep -B 20 -A 80 "What went wrong" /tmp/gradle-build.log | head -140 || tail -n 100 /tmp/gradle-build.log
            echo '```'
            echo "_(automated diagnostics from run ${{ github.run_id }})_"
          } > /tmp/comment.md
          PAYLOAD=$(jq -n --rawfile b /tmp/comment.md '{body: $b}')
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$PAYLOAD" > /dev/null || echo "(could not post commit comment)"

      - name: Collect artifacts
        if: success()
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/WordSearchKing-v1.0.0.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab artifacts/WordSearchKing-v1.0.0.aab
          ls -la artifacts

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word-search-king-apk
          path: artifacts/WordSearchKing-v1.0.0.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: word-search-king-aab
          path: artifacts/WordSearchKing-v1.0.0.aab
          if-no-files-found: error
          compression-level: 0

  # Permanent smoke test: launch every freshly built APK on an emulator and
  # verify the app actually opens without crashing.
  smoke:
    name: Smoke test APK (emulator)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: word-search-king-apk

      - name: Launch APK on emulator
        uses: ./.github/actions/emulator-smoke
        with:
          apk-path: WordSearchKing-v1.0.0.apk

  # Temporary diagnostic job (remove once the startup crash is fixed):
  # runs the PREVIOUS apk in parallel with the rebuild, so the crash stack
  # trace is available quickly. Triggered by "smoke-previous" in the commit
  # message.
  smoke-previous:
    name: Smoke test previous APK (emulator)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'smoke-previous')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download previous release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=34599044346
          echo "Taking APK from Android Build run $RUN_ID"
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "word-search-king-apk") | .id][0]')
          if [ -z "$ART_ID" ]; then
            echo "::error::No word-search-king-apk artifact found in run $RUN_ID"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > apk.zip
          unzip -o apk.zip
          ls -la WordSearchKing-v1.0.0.apk

      - name: Launch previous APK on emulator
        uses: ./.github/actions/emulator-smoke
        with:
          apk-path: WordSearchKing-v1.0.0.apk
          logcat-artifact-name: smoke-logcat-previous
