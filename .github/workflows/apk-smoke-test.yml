name: APK Smoke Test (Emulator)

# Launches the built release APK on an Android emulator and verifies the app
# actually opens without crashing. Captures the logcat stack trace if it does.
#
# Can be triggered manually (optionally with a specific Android Build run id);
# the smoke-test job is also part of android-build.yml for every push.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Android Build run ID to take the APK from (blank = latest successful)'
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  smoke:
    name: Launch release APK on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download release APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ inputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?status=success&per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "Android Build")][0].id')
          fi
          echo "Taking APK from Android Build run $RUN_ID"
          ART_ID=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "word-search-king-apk") | .id][0]')
          if [ -z "$ART_ID" ]; then
            echo "::error::No word-search-king-apk artifact found in run $RUN_ID"
            exit 1
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" > apk.zip
          unzip -o apk.zip
          ls -la WordSearchKing-v1.0.0.apk

      - name: Boot emulator and launch the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none -no-metrics
          emulator-boot-timeout: 900
          script: |
            set +e
            echo "=== Installing APK ==="
            adb install -r WordSearchKing-v1.0.0.apk
            adb logcat -c
            echo "=== Launching com.wordsearchking.game/.MainActivity ==="
            adb shell am start -W -n com.wordsearchking.game/.MainActivity
            sleep 40
            adb logcat -d > /tmp/logcat.txt

            echo "=== Resumed activity ==="
            adb shell "dumpsys activity activities | grep -E 'ResumedActivity' | head -3"

            PID=$(adb shell pidof com.wordsearchking.game | tr -d '\r\n ')
            FATALS=$(grep -c "FATAL EXCEPTION" /tmp/logcat.txt)

            echo "=== pidof: '$PID' | fatal exceptions: $FATALS ==="
            echo "=== ReactNativeJS lines ==="
            grep "ReactNativeJS" /tmp/logcat.txt | head -40

            CRASH=0
            if [ -z "$PID" ]; then
              CRASH=1
              echo "::error::App process is NOT running 40s after launch - crashed on open"
            fi
            if [ "$FATALS" != "0" ]; then
              CRASH=1
              echo "::error::FATAL EXCEPTION detected in logcat"
            fi
            if [ "$CRASH" != "0" ]; then
              echo "=== FATAL EXCEPTION excerpt ==="
              grep -A 60 "FATAL EXCEPTION" /tmp/logcat.txt | head -90
              exit 1
            fi
            echo "App is alive and running (pid $PID) - smoke test PASSED"

      - name: Report crash details (annotations + commit comment)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/logcat.txt ]; then
            echo "::error::No logcat captured (emulator may have failed to boot - check job logs)"
            exit 0
          fi
          # Annotations (first 10 lines of the crash stack - GitHub caps at 10)
          grep -A 60 "FATAL EXCEPTION" /tmp/logcat.txt | head -60 | sed 's/%/%25/g; s/\r$//' | \
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:900}" || true
            done
          # Commit comment with the full picture
          {
            echo "### APK smoke test — app crashed on open"
            echo ""
            echo "#### FATAL EXCEPTION (logcat)"
            echo '```'
            grep -B 2 -A 80 "FATAL EXCEPTION" /tmp/logcat.txt | head -130
            echo '```'
            echo ""
            echo "#### ReactNativeJS log lines"
            echo '```'
            grep "ReactNativeJS" /tmp/logcat.txt | head -40 || echo "(none)"
            echo '```'
            echo ""
            echo "#### Last 40 logcat lines"
            echo '```'
            tail -n 40 /tmp/logcat.txt
            echo '```'
            echo "_(automated diagnostics from smoke-test run ${{ github.run_id }})_"
          } > /tmp/comment.md
          head -c 60000 /tmp/comment.md > /tmp/comment-trunc.md
          PAYLOAD=$(jq -n --rawfile b /tmp/comment-trunc.md '{body: $b}')
          SHA=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq '.sha')
          curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/comments" \
            -d "$PAYLOAD" > /dev/null || echo "(could not post commit comment)"

      - name: Upload logcat artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat
          path: /tmp/logcat.txt
          if-no-files-found: ignore
