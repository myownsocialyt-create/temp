name: 'Emulator APK smoke test'
description: 'Boots an Android emulator, installs an APK, launches it and fails if the app crashes'

inputs:
  apk-path:
    description: 'Path to the APK file (relative to workspace)'
    required: true
  package:
    description: 'Application package id'
    required: false
    default: 'com.wordsearchking.game'
  activity:
    description: 'Launcher activity (relative to package)'
    required: false
    default: '.MainActivity'
  github-token:
    description: 'Token used to post crash diagnostics as a commit comment'
    required: false
    default: ${{ github.token }}
  logcat-artifact-name:
    description: 'Name for the uploaded logcat artifact'
    required: false
    default: 'smoke-logcat'

runs:
  using: 'composite'
  steps:
    - name: Boot emulator and launch the app
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -camera-back none -camera-front none -no-metrics
        emulator-boot-timeout: 900
        script: |
          set +e
          echo "=== Installing APK ==="
          adb install -r "${{ inputs.apk-path }}"
          adb logcat -c
          echo "=== Launching ${{ inputs.package }}/${{ inputs.activity }} ==="
          adb shell am start -W -n ${{ inputs.package }}/${{ inputs.activity }}
          sleep 40
          adb logcat -d > /tmp/logcat.txt

          echo "=== Resumed activity ==="
          adb shell "dumpsys activity activities | grep -E 'ResumedActivity' | head -3"

          PID=$(adb shell pidof ${{ inputs.package }} | tr -d '\r\n ')
          FATALS=$(grep -c "FATAL EXCEPTION" /tmp/logcat.txt)

          echo "=== pidof: '$PID' | fatal exceptions: $FATALS ==="
          echo "=== ReactNativeJS lines ==="
          grep "ReactNativeJS" /tmp/logcat.txt | head -40

          CRASH=0
          if [ -z "$PID" ]; then
            CRASH=1
            echo "::error::App process is NOT running 40s after launch - crashed on open"
          fi
          if [ "$FATALS" != "0" ]; then
            CRASH=1
            echo "::error::FATAL EXCEPTION detected in logcat"
          fi
          if [ "$CRASH" != "0" ]; then
            echo "=== FATAL EXCEPTION excerpt ==="
            grep -A 60 "FATAL EXCEPTION" /tmp/logcat.txt | head -90
            exit 1
          fi
          echo "App is alive and running (pid $PID) - smoke test PASSED"

    - name: Report crash details (annotations + commit comment)
      if: failure()
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ ! -f /tmp/logcat.txt ]; then
          echo "::error::No logcat captured (emulator may have failed to boot - check job logs)"
          exit 0
        fi
        # Annotations: first lines of the crash stack (GitHub caps annotations at 10)
        grep -A 60 "FATAL EXCEPTION" /tmp/logcat.txt | head -60 | sed 's/%/%25/g; s/\r$//' | \
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}" || true
          done
        # Commit comment with the full picture
        {
          echo "### Emulator smoke test — app crashed on open"
          echo ""
          echo "#### FATAL EXCEPTION (logcat)"
          echo '```'
          grep -B 2 -A 80 "FATAL EXCEPTION" /tmp/logcat.txt | head -130
          echo '```'
          echo ""
          echo "#### ReactNativeJS log lines"
          echo '```'
          grep "ReactNativeJS" /tmp/logcat.txt | head -40 || echo "(none)"
          echo '```'
          echo ""
          echo "#### Last 40 logcat lines"
          echo '```'
          tail -n 40 /tmp/logcat.txt
          echo '```'
          echo "_(automated diagnostics from smoke test in run ${{ github.run_id }})_"
        } > /tmp/comment.md
        head -c 60000 /tmp/comment.md > /tmp/comment-trunc.md
        PAYLOAD=$(jq -n --rawfile b /tmp/comment-trunc.md '{body: $b}')
        SHA=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq '.sha')
        curl -s -X POST \
          -H "Authorization: Bearer ${{ inputs.github-token }}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/commits/$SHA/comments" \
          -d "$PAYLOAD" > /dev/null || echo "(could not post commit comment)"

    - name: Upload logcat artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.logcat-artifact-name }}
        path: /tmp/logcat.txt
        if-no-files-found: ignore
